<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 44" width="360" height="44" role="img" aria-label="Created by @igect">
  <title>Created by @igect</title>
  <defs>
    <linearGradient id="accentGradDark" x1="0%" y1="0%" x2="200%" y2="0%" spreadMethod="reflect">
      <stop offset="0%" stop-color="#FF7D38" />
      <stop offset="35%" stop-color="#FFA94D" />
      <stop offset="65%" stop-color="#FFD426" />
      <stop offset="100%" stop-color="#FF7D38" />
      <animate attributeName="x1" values="0%;-100%" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="4.2s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="barGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7D38" />
      <stop offset="65%" stop-color="#FFD426" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #E6EDF3;
        letter-spacing: -0.01em;
      }
      .handle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        fill: url(#accentGradDark);
        letter-spacing: -0.01em;
      }
      .dot {
        fill: #FF9F43;
        transform-origin: 109px 21px;
        animation: pulse 2.6s ease-in-out infinite;
      }
      .underline {
        fill: url(#barGradDark);
        transform-origin: 233px 32px;
        animation: sweep 3.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(0.88); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes sweep {
        0%, 100% { opacity: 0.65; transform: scaleX(0.78); }
        50% { opacity: 1; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot, .underline { animation: none; }
      }
    </style>
  </defs>
  <circle cx="109" cy="21" r="3.5" class="dot" />
  <text x="198" y="25.5" text-anchor="end" class="label">Created by</text>
  <text x="204" y="25.5" text-anchor="start" class="handle">@igect</text>
  <rect x="204" y="31" width="58" height="2.4" rx="1.2" class="underline" />
</svg>
