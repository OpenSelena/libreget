<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 44" width="360" height="44" role="img" aria-label="Created by Igect">
  <title>Created by Igect</title>
  <defs>
    <linearGradient id="linkGradLight" x1="0%" y1="0%" x2="200%" y2="0%" spreadMethod="reflect">
      <stop offset="0%" stop-color="#0969DA" />
      <stop offset="50%" stop-color="#218BFF" />
      <stop offset="100%" stop-color="#0969DA" />
      <animate attributeName="x1" values="0%;-100%" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="4.2s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #1F2328;
        letter-spacing: -0.01em;
      }
      .handle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        fill: url(#linkGradLight);
        letter-spacing: -0.01em;
      }
      .gh-icon {
        fill: #1F2328;
        transform-box: fill-box;
        transform-origin: center;
        animation: floatSlow 3s ease-in-out infinite;
      }
      .sparkle-icon {
        fill: #0969DA;
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 2.6s ease-in-out infinite;
      }
      .underline {
        fill: #0969DA;
        transform-box: fill-box;
        transform-origin: center;
        animation: sweep 3.2s ease-in-out infinite;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.9; }
        50% { transform: translateY(-1.5px) scale(1.06); opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { transform: scale(0.84) rotate(-6deg); opacity: 0.65; }
        50% { transform: scale(1.1) rotate(8deg); opacity: 1; }
      }
      @keyframes sweep {
        0%, 100% { opacity: 0.45; transform: scaleX(0.78); }
        50% { opacity: 0.9; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .gh-icon, .sparkle-icon, .underline { animation: none; }
      }
    </style>
  </defs>
