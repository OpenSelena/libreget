name: SignPath Test Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sign-windows:
    name: Test Sign Windows Binary
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # master
        with:
          toolchain: 1.97.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Build LibreGet Windows application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --no-bundle

      - name: Upload unsigned executable for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-libreget-binary
          path: src-tauri/target/release/libreget.exe
          if-no-files-found: error

      - name: Submit test-signing request to SignPath
        id: signpath-test
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'a2f98e24-2f0b-4dd6-a11b-64350d467226'
          project-slug: 'libreget'
          signing-policy-slug: 'test-signing'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600
          output-artifact-directory: 'signed-output'

      - name: Verify Authenticode Signature
        shell: pwsh
        run: |
          $signed = Get-ChildItem "signed-output" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $signed) {
            throw "No signed binary found in signed-output"
          }
          Write-Host "Found signed binary: $($signed.FullName)"
          $sig = Get-AuthenticodeSignature $signed.FullName
          $sig | Format-List *
          Write-Host "=========================================="
          Write-Host "Signer Certificate Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Signer Certificate Issuer:  $($sig.SignerCertificate.Issuer)"
          Write-Host "Status:                     $($sig.Status)"
          Write-Host "StatusMessage:              $($sig.StatusMessage)"
          Write-Host "=========================================="

      - name: Upload signed test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-libreget-test-binary
          path: signed-output/**

